name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  AUTH_SECRET: ci-placeholder-secret-not-for-production-use
  POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: ci-admin-pass-12

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: node scripts/migrate-deploy.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/migrate-deploy.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
